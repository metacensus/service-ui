name: Build

# Validates the production artifact at the source: builds the published image
# and smoke-tests that it does its job — the SPA host serves the app (root,

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# The checks build the image with `load: true` and never push it; on a push to
# main, once they pass, the publish job builds it again for linux/arm64 and
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the SPA
        run: npm run tsc

      - name: Run tests
        run: npm test

  build-and-smoke-test:
    name: Build and smoke-test the SPA image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, loaded into the local docker)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: metacensus/ui:ci
          platforms: linux/amd64

      - name: Smoke test the served SPA
        run: |
          docker run -d --name ui-ci -p 8080:8080 metacensus/ui:ci
          # Wait for Caddy to accept connections.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          root_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          deep_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/topics/abc)
          miss_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/does-not-exist.js)
          echo "root=$root_code deep-link=$deep_code missing-asset=$miss_code"
          test "$root_code" = "200"                       # SPA served at /
          test "$deep_code" = "200"                       # deep link → SPA history fallback
          test "$miss_code" = "404"                       # missing asset 404s, not fallback
          # The deep-link response is index.html (the app shell), not a real file.
          curl -s http://localhost:8080/topics/abc | grep -q '<div id="root"></div>'

      - name: Container logs on failure
        if: failure()
        run: docker logs ui-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f ui-ci || true

  publish:
    name: Publish main to ECR
    needs: [checks, build-and-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY: metacensus/ui
    steps:
      - name: Require the push role
        env:
          MAIN_IMAGE_ROLE_ARN: ${{ vars.MAIN_IMAGE_ROLE_ARN }}
        run: |
          if [ -z "$MAIN_IMAGE_ROLE_ARN" ]; then
            exit 1
          fi

      - uses: actions/checkout@v4

      # A re-run of an older main run must not move main back to its commit.
      - name: Check this commit is main's head
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | awk '$2 == "refs/heads/main" {print $1}')
          echo "current=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.MAIN_IMAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # sha- tags are immutable and every build has a new digest, so a re-run for
      # a commit already in ECR reuses its image rather than pushing another.
      - name: Look for this commit's image
        id: existing
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          image="$REGISTRY/$ECR_REPOSITORY:$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if out=$(docker buildx imagetools inspect "$image" 2>&1); then
            echo "image=$image" >> "$GITHUB_OUTPUT"
          elif ! grep -qi 'not found' <<<"$out"; then
            echo "$out" >&2
            exit 1
          fi

      - name: Point main at the existing image
        if: steps.existing.outputs.image != '' && steps.head.outputs.current == 'true'
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
        run: docker buildx imagetools create --prefer-index=false --tag "${IMAGE%:*}:main" "$IMAGE"

      - name: Extract metadata for Docker
        if: steps.existing.outputs.image == ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.existing.outputs.tag }}
            type=ref,event=branch,enable=${{ steps.head.outputs.current == 'true' }}

      # One platform, the nodes', and no attestations: the push is a single
      # manifest rather than an index, so the repository's untagged-image expiry
      # can't remove a platform an index still references.
      - name: Build and push
        if: steps.existing.outputs.image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}

