name: Build

# Validates the production artifact at the source: builds the published image
# and smoke-tests that it does its job — the SPA host serves the app (root,
# deep-link SPA fallback, and a 404 for a missing asset). This is what lets
# consumers run the UI from the Vite dev server for hot reload without risking
# dev-vs-build drift going undetected — build correctness is proven here.

on:
  pull_request:
  push:
    branches: [main]

# A newer run on a pull request cancels an older one. On main a newer run
# waits instead, so it never stops a rollout midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks build the image with `load: true` and never push it; on a push to
# main, once they pass, the publish job builds it again for linux/arm64 and
# pushes it to the container registry.
permissions:
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the SPA
        run: npm run tsc

      - name: Run tests
        run: npm test

      - name: Run Chromium against Fabric
        if: github.event_name == 'pull_request'
        timeout-minutes: 25
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run e2e

  build-and-smoke-test:
    name: Build and smoke-test the SPA image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, loaded into the local docker)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: metacensus/service-ui:ci
          platforms: linux/amd64

      - name: Smoke test the served SPA
        run: |
          docker run -d --name service-ui-ci -p 8080:8080 metacensus/service-ui:ci
          # Wait for Caddy to accept connections.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          root_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          deep_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/topics/abc)
          miss_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/does-not-exist.js)
          echo "root=$root_code deep-link=$deep_code missing-asset=$miss_code"
          test "$root_code" = "200"                       # SPA served at /
          test "$deep_code" = "200"                       # deep link → SPA history fallback
          test "$miss_code" = "404"                       # missing asset 404s, not fallback
          # The deep-link response is index.html (the app shell), not a real file.
          curl -s http://localhost:8080/topics/abc | grep -q '<div id="root"></div>'

      - name: Container logs on failure
        if: failure()
        run: docker logs service-ui-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f service-ui-ci || true

  # Main builds go to this app's private registry repository, for environments
  # that track main; releases go to public Docker Hub (release.yml).
  publish:
    name: Publish main to ECR
    needs: [checks, build-and-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      current: ${{ steps.head.outputs.current }}
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY: metacensus/service-ui
    steps:
      - name: Require the push role
        env:
          MAIN_IMAGE_ROLE_ARN: ${{ vars.MAIN_IMAGE_ROLE_ARN }}
        run: |
          if [ -z "$MAIN_IMAGE_ROLE_ARN" ]; then
            echo "::error title=Missing variable::MAIN_IMAGE_ROLE_ARN is not set. Set it to the ARN of the role that may push this app's images: gh variable set MAIN_IMAGE_ROLE_ARN --repo metacensus/service-ui --body <arn>"
            exit 1
          fi

      - uses: actions/checkout@v4

      # A re-run of an older main run must not move main back to its commit.
      - name: Check this commit is main's head
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | awk '$2 == "refs/heads/main" {print $1}')
          echo "current=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.MAIN_IMAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # sha- tags are immutable and every build has a new digest, so a re-run for
      # a commit already in ECR reuses its image rather than pushing another.
      - name: Look for this commit's image
        id: existing
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          image="$REGISTRY/$ECR_REPOSITORY:$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if out=$(docker buildx imagetools inspect "$image" 2>&1); then
            echo "image=$image" >> "$GITHUB_OUTPUT"
          elif ! grep -qi 'not found' <<<"$out"; then
            echo "$out" >&2
            exit 1
          fi

      - name: Point main at the existing image
        if: steps.existing.outputs.image != '' && steps.head.outputs.current == 'true'
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
        run: docker buildx imagetools create --prefer-index=false --tag "${IMAGE%:*}:main" "$IMAGE"

      - name: Extract metadata for Docker
        if: steps.existing.outputs.image == ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.existing.outputs.tag }}
            type=ref,event=branch,enable=${{ steps.head.outputs.current == 'true' }}

      # One platform, the nodes', and no attestations: the push is a single
      # manifest rather than an index, so the repository's untagged-image expiry
      # can't remove a platform an index still references.
      - name: Build and push
        if: steps.existing.outputs.image == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The rollout role may only restart this app's Deployment in its environment; with
  # pull Always, the restart runs the image publish just moved main to. A run
  # for a commit that is no longer main's head moved nothing, so it skips this.
  restart-staging:
    name: Restart staging
    needs: publish
    if: needs.publish.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    env:
      CLUSTER: metacensus-main
      NAMESPACE: staging
      DEPLOYMENT: service-ui
    steps:
      - name: Require the rollout role
        env:
          STAGING_ROLLOUT_ROLE_ARN: ${{ vars.STAGING_ROLLOUT_ROLE_ARN }}
        run: |
          if [ -z "$STAGING_ROLLOUT_ROLE_ARN" ]; then
            echo "::error title=Missing variable::STAGING_ROLLOUT_ROLE_ARN is not set. Set it to the ARN of the role that may restart this app's Deployment: gh variable set STAGING_ROLLOUT_ROLE_ARN --repo metacensus/service-ui --body <arn>"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.STAGING_ROLLOUT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Restart
        run: kubectl --namespace "$NAMESPACE" rollout restart "deployment/$DEPLOYMENT"

      # The Deployment's progress deadline fails a rollout that stalls.
      - name: Wait for the rollout
        run: kubectl --namespace "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=10m
