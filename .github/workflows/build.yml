name: Build


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the SPA
        run: npm run tsc

      - name: Run tests
        run: npm test

  build-and-smoke-test:
    name: Build and smoke-test the SPA image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, loaded into the local docker)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: metacensus/ui:ci
          platforms: linux/amd64

      - name: Smoke test the served SPA
        run: |
          docker run -d --name ui-ci -p 8080:8080 metacensus/ui:ci
          # Wait for Caddy to accept connections.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          root_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          deep_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/topics/abc)
          miss_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/does-not-exist.js)
          echo "root=$root_code deep-link=$deep_code missing-asset=$miss_code"
          test "$root_code" = "200"                       # SPA served at /
          test "$deep_code" = "200"                       # deep link → SPA history fallback
          test "$miss_code" = "404"                       # missing asset 404s, not fallback
          # The deep-link response is index.html (the app shell), not a real file.
          curl -s http://localhost:8080/topics/abc | grep -q '<div id="root"></div>'

      - name: Container logs on failure
        if: failure()
        run: docker logs ui-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f ui-ci || true
    permissions:
      contents: read
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
